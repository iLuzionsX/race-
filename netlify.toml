[build]
  command = "mkdir -p dist && cp README.md dist/index.txt"
  publish = "dist"

[context.deploy-preview]
  command = "node scripts/ox-build.mjs && node scripts/diagnostic-marker.mjs"

[context.branch-deploy]
  command = "node scripts/ox-build.mjs && node scripts/diagnostic-marker.mjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
